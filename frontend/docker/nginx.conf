server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend hostname on every request instead of once at
    # startup: platforms like Railway assign the backend a new internal IP
    # on each redeploy, and a static proxy_pass target would keep pointing
    # at the old (now dead) IP until this container itself restarts.
    resolver __RESOLVER__ valid=10s;
    resolver_timeout 5s;

    # Reverse proxy API requests to the backend service so the browser
    # only ever talks to a single origin (no CORS needed in production).
    location /api/ {
        set $backend_upstream http://__BACKEND_HOST__:__BACKEND_PORT__;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router uses history mode: fall back to index.html for any
    # unmatched route so refreshing a deep link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
