server:
  port: ${PORT:8080}

spring:
  application:
    name: torneo_germans_bisbal_api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/torneo_germans_bisbal_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-5.4-mini

  web:
    error:
      include-stacktrace: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${APP_JWT_SECRET:please-override-this-in-your-env-file}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_EXP_MIN:15}
  refresh-token:
    expiration-days: ${APP_REFRESH_EXP_DAYS:30}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
